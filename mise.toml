[settings]
experimental = true

[tools]
"aqua:nextest-rs/nextest/cargo-nextest" = "latest"
"cargo:cargo-release" = "latest"
"cargo:samply" = "latest"
hk = "latest"
pkl = "latest"
rust = "latest"

[env]
_.file = ".env.json"
EMBEDDER_API_KEY = "{{ env.DEEPINFRA_API_KEY }}"

[tasks.test]
run = '''
set -euo pipefail
cargo nextest run
cargo nextest run --features local
if [ "$(uname -s)" = "Darwin" ]; then
  cargo nextest run --features metal
else
  echo "Skipping accelerator passthrough feature test runs in the default repo gate; they require platform-specific native toolchains."
fi
'''
