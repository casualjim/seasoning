name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup build environment
        uses: ./.github/actions/setup-env
        env:
          MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: "Bearer ${{ secrets.CARGO_REGISTRY_TOKEN }}"
          DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}

      - name: Run tests
        env:
          CARGO_REGISTRY_TOKEN: "${{ secrets.CARGO_REGISTRY_TOKEN }}"
          DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
        run: |
          mise test -- --local-embeddings

  publish:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup build environment
        uses: ./.github/actions/setup-env
        env:
          MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: "Bearer ${{ secrets.CARGO_REGISTRY_TOKEN }}"
          DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}

      - name: Determine version bump
        id: bump
        uses: actions/github-script@v7
        with:
          script: |
            const bumpTokens = [
              { token: "bump:major", level: "major" },
              { token: "bump:minor", level: "minor" },
              { token: "bump:patch", level: "patch" },
            ];
            let text = "";

            const pulls = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
            });

            if (pulls.data && pulls.data.length > 0) {
              const pr = pulls.data[0];
              text = `${pr.title}\n${pr.body || ""}`;
            } else {
              const commit = await github.rest.repos.getCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: context.sha,
              });
              text = commit.data.commit.message || "";
            }

            const lower = text.toLowerCase();
            let bump = "patch";
            if (lower.includes("bump:major")) {
              bump = "major";
            } else if (lower.includes("bump:minor")) {
              bump = "minor";
            } else if (lower.includes("bump:patch")) {
              bump = "patch";
            }

            core.setOutput("level", bump);

      - name: Publish to Cargo Registry
        env:
          CARGO_REGISTRY_TOKEN: "${{ secrets.CARGO_REGISTRY_TOKEN }}"
          DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          cargo release ${{ steps.bump.outputs.level }} --execute --no-confirm --features local
