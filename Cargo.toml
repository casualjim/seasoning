[package]
name = "seasoning"
version = "0.2.4"
edition = "2024"
description = "Embedding and reranking infrastructure with rate limiting and retry logic"
license = "MIT OR Apache-2.0"
repository = "https://github.com/casualjim/seasoning"
documentation = "https://docs.rs/seasoning"
readme = "README.md"
keywords = ["embedding", "reranking", "ai", "llm", "search"]
categories = ["api-bindings", "web-programming"]

[package.metadata.release]
sign-commit = false
sign-tag = false
publish = false
allow-branch = ["main"]
pre-release-commit-message = "chore: Release {{crate_name}} version {{version}}"

[features]
default = []
local = ["dep:hf-hub", "dep:llama-cpp-2"]
cuda = ["local", "llama-cpp-2/cuda"]
metal = ["local", "llama-cpp-2/metal"]
vulkan = ["local", "llama-cpp-2/vulkan"]

[dependencies]
async-trait = "0.1"
bytes = "1"
futures = "0.3"
hf-hub = { version = "1", optional = true, default-features = false, features = ["blocking"] }
http = "1"
llama-cpp-2 = { version = "0.1.153", optional = true, default-features = false }
pin-project-lite = "0.2"
reqwest = { version = "0.13", features = ["json", "stream"] }
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tiktoken-rs = "0.12.0"
tokenizers = { version = "0.23.1", default-features = false, features = ["esaxx_fast", "http", "onig"] }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
wiremock = "0.6"
